# Template proposals (R77): AEC Studio commits a record templates/proposals/<id>@<version>.json (or default-<id>.json) to main;
# this turns each into a pull request that adds templates/<id>/<version>.json (or changes templates/default.json)
# and removes the record. Only the owner merges. A pull request closed without merging removes its record, so it
# can be proposed again. Needs, in Settings → Actions → General: "Read and write permissions" and "Allow GitHub Actions to
# create and approve pull requests".
name: template proposals
on:
  push:
    branches: [main]
    paths: ["templates/proposals/**"]
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: template-proposals
  cancel-in-progress: false
jobs:
  open:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Open a pull request for each template proposal
        run: node .github/scripts/template-proposals.mjs open
        env:
          GH_TOKEN: ${{ github.token }}
  closed:
    if: github.event_name == 'pull_request' && !github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'template/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Remove the record of a proposal that was not merged
        run: node .github/scripts/template-proposals.mjs closed "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
